<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>测你是S还是M</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4eefc;
        --ink-soft: #cfc0e8;
        --ink-faint: #a68fc9;
        --accent: #a55eea;
        --accent-2: #e056b8;
        --accent-strong: #c084fc;
        --gold: #f2c14e;
        --card: rgba(38, 24, 64, 0.88);
        --card-2: rgba(58, 38, 96, 0.65);
        --line: rgba(196, 160, 255, 0.35);
        --track: rgba(255, 255, 255, 0.14);
        --radius: 20px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Noto Sans CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--ink);
        min-height: 100dvh;
        -webkit-tap-highlight-color: transparent;
        background:
          radial-gradient(560px 380px at 12% -6%, rgba(224, 86, 184, 0.34), transparent 62%),
          radial-gradient(640px 460px at 105% 22%, rgba(124, 58, 237, 0.5), transparent 60%),
          radial-gradient(520px 420px at 50% 112%, rgba(76, 29, 149, 0.65), transparent 62%),
          linear-gradient(165deg, #2a1454 0%, #1c0f38 46%, #120826 100%);
        background-attachment: fixed;
        overflow-x: hidden;
      }
      /* 点阵纹理层 */
      body::before {
        content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
        background-image: radial-gradient(rgba(216, 180, 254, 0.14) 1.2px, transparent 1.3px);
        background-size: 22px 22px;
        mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
        -webkit-mask-image: linear-gradient(180deg, transparent, #000 18%, #000 82%, transparent);
      }
      /* 漂浮光晕 */
      .orb { position: fixed; border-radius: 50%; filter: blur(46px); pointer-events: none; z-index: 0; opacity: .55; }
      .orb-1 { width: 230px; height: 230px; left: -70px; top: 16%; background: #7c3aed; animation: drift 11s ease-in-out infinite alternate; }
      .orb-2 { width: 180px; height: 180px; right: -60px; top: 58%; background: #db2777; opacity: .38; animation: drift 14s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translateY(-16px); } to { transform: translateY(26px); } }

      .wrap {
        position: relative; z-index: 1;
        max-width: 560px; margin: 0 auto;
        padding: 22px 18px calc(30px + env(safe-area-inset-bottom));
        min-height: 100dvh; display: flex; flex-direction: column;
      }
      .screen { display: none; flex: 1; flex-direction: column; }
      .screen.active { display: flex; }

      /* ---------- 通用卡片：渐变描边 + 光晕 ---------- */
      .panel {
        position: relative;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 24px 50px rgba(5, 0, 18, 0.55), 0 0 0 1px rgba(0,0,0,.25), 0 0 42px rgba(139, 92, 246, 0.22);
        backdrop-filter: blur(6px);
      }
      .panel::before {
        content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: linear-gradient(160deg, rgba(255,255,255,.13), transparent 34%);
      }

      .btn {
        appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800;
        border-radius: 15px; min-height: 54px; padding: 12px 22px; position: relative; overflow: hidden;
        transition: transform .08s ease, filter .15s ease;
      }
      .btn:active { transform: scale(.97); }
      .btn-primary {
        width: 100%; font-size: 17.5px; color: #fff; letter-spacing: 1px;
        background: linear-gradient(120deg, #7c3aed, #a855f7 55%, #d946ef);
        box-shadow: 0 14px 30px rgba(147, 51, 234, 0.45), inset 0 1px 0 rgba(255,255,255,.35);
      }
      .btn-primary::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 46px; left: -70px;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
        transform: skewX(-18deg); animation: shine 2.8s ease-in-out infinite;
      }
      @keyframes shine { 0%, 55% { left: -70px; } 85%, 100% { left: 115%; } }
      .btn-ghost {
        background: var(--card-2); color: var(--ink); border: 1px solid var(--line); font-size: 15.5px;
      }

      /* ---------- 封面 ---------- */
      .cover { justify-content: center; text-align: center; padding: 18px 0 6px; }
      .cover-inner { padding: 34px 20px 28px; }
      .duo { display: flex; justify-content: center; align-items: stretch; gap: 12px; margin-bottom: 28px; }
      .duo .letter {
        width: 112px; height: 142px; border-radius: 18px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        position: relative;
      }
      .duo .letter b { font-size: 62px; line-height: 1; font-weight: 900; }
      .duo .letter span { margin-top: 10px; font-size: 13px; }
      .duo .s {
        color: #fff; transform: rotate(-2.5deg);
        background: linear-gradient(150deg, #8b5cf6, #6d28d9 60%, #4c1d95);
        border: 1px solid rgba(216,180,254,.6);
        box-shadow: 0 16px 34px rgba(109, 40, 217, .55), 0 0 30px rgba(168, 85, 247, .45);
        animation: bob 3.4s ease-in-out infinite;
      }
      .duo .s span { color: rgba(255,255,255,.85); }
      .duo .m {
        color: var(--ink); transform: rotate(2.5deg);
        background: linear-gradient(160deg, rgba(88, 60, 140, .9), rgba(46, 28, 84, .95));
        border: 1px dashed rgba(240, 171, 252, .55);
        box-shadow: 0 16px 34px rgba(10, 2, 30, .5), 0 0 26px rgba(217, 70, 239, .22);
        animation: bob 3.4s ease-in-out .5s infinite;
      }
      .duo .m span { color: var(--ink-soft); }
      @keyframes bob { 0%, 100% { margin-top: 0; } 50% { margin-top: -7px; } }
      .duo .vs {
        align-self: center; font-size: 12.5px; font-weight: 900; color: #2a1454;
        background: linear-gradient(140deg, #fde68a, var(--gold));
        border-radius: 999px; padding: 5px 11px; z-index: 1;
        box-shadow: 0 6px 16px rgba(242, 193, 78, .45);
      }
      h1 {
        font-size: 35px; line-height: 1.25; margin: 0 0 12px; font-weight: 900; letter-spacing: 1px;
        text-shadow: 0 4px 24px rgba(168, 85, 247, .5);
      }
      h1 .hl { color: var(--gold); }
      .subtitle { font-size: 16.5px; line-height: 1.7; color: var(--ink-soft); margin: 0 auto 24px; max-width: 21em; }
      .meta-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
      .meta-row span {
        font-size: 13px; color: var(--ink-soft);
        border: 1px solid var(--line); background: rgba(255,255,255,.06);
        border-radius: 999px; padding: 6px 12px;
      }
      .cover-note { margin-top: 18px; font-size: 13px; color: var(--ink-faint); line-height: 1.6; }

      /* ---------- 题目页 ---------- */
      .quiz-top { margin-bottom: 16px; }
      .progress-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
      .progress-meta .count { font-size: 15.5px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
      .progress-meta .count em { font-style: normal; color: var(--gold); font-size: 19px; }
      .progress-meta .pct { font-size: 13px; color: var(--ink-soft); }
      .track {
        height: 10px; border-radius: 999px; background: var(--track); overflow: hidden;
        border: 1px solid rgba(255,255,255,.08);
        box-shadow: inset 0 2px 5px rgba(0,0,0,.45);
      }
      .track i {
        display: block; height: 100%; width: 0; border-radius: 999px;
        background: linear-gradient(90deg, #7c3aed, #c026d3);
        box-shadow: 0 0 12px rgba(217, 70, 239, .8);
        position: relative; transition: width .35s ease;
      }
      .track i::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        background: repeating-linear-gradient(115deg, rgba(255,255,255,.28) 0 8px, transparent 8px 16px);
        animation: slide 0.9s linear infinite;
      }
      @keyframes slide { to { transform: translateX(11px); } }
      .qcard { padding: 24px 18px 20px; }
      .qcard.enter { animation: qin .34s cubic-bezier(.2, .9, .3, 1.2); }
      @keyframes qin { from { opacity: 0; transform: translateX(26px) scale(.985); } to { opacity: 1; transform: none; } }
      .qnum {
        display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--gold);
        border: 1px solid rgba(242, 193, 78, .45); border-radius: 999px; padding: 3px 10px; margin-bottom: 12px;
        background: rgba(242, 193, 78, .08);
      }
      .qtext { font-size: 19.5px; line-height: 1.62; font-weight: 800; margin: 0 0 20px; }
      .options { display: grid; gap: 11px; }
      .opt {
        appearance: none; cursor: pointer; text-align: left; font: inherit;
        display: flex; align-items: center; gap: 12px; position: relative;
        width: 100%; min-height: 58px; padding: 12px 14px;
        background: rgba(255, 255, 255, 0.055); color: var(--ink);
        border: 1.5px solid var(--line); border-radius: 15px;
        font-size: 16px; line-height: 1.5;
        transition: border-color .12s ease, background .12s ease, transform .1s ease;
        animation: opin .3s ease both;
      }
      .opt:nth-child(2) { animation-delay: .05s; }
      .opt:nth-child(3) { animation-delay: .1s; }
      .opt:nth-child(4) { animation-delay: .15s; }
      @keyframes opin { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
      .opt:hover { border-color: var(--accent-strong); transform: translateY(-1px); }
      .opt:active { transform: scale(.985); }
      .opt .key {
        flex: 0 0 auto; width: 29px; height: 29px; border-radius: 9px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(255,255,255,.08); border: 1px solid var(--line);
        font-size: 14px; font-weight: 800; color: var(--ink-soft);
      }
      .opt.picked {
        background: linear-gradient(120deg, #7c3aed, #b02fd6); border-color: #e9b8ff; color: #fff;
        box-shadow: 0 10px 24px rgba(168, 85, 247, .5), 0 0 18px rgba(217, 70, 239, .5);
        animation: pop .32s cubic-bezier(.2, 1.4, .4, 1) both;
      }
      .opt.picked .key { background: rgba(255,255,255,.22); border-color: transparent; color: #fff; }
      .opt.picked::after {
        content: "✓"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        font-weight: 900; font-size: 17px; color: #fff;
      }
      @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.045); } 100% { transform: scale(1.015); } }
      .quiz-foot { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .back-btn {
        appearance: none; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 999px;
        cursor: pointer; font: inherit; color: var(--ink-soft); font-size: 14.5px; padding: 8px 14px; min-height: 44px;
      }
      .back-btn:disabled { opacity: .35; cursor: default; }
      .hint { font-size: 12.5px; color: var(--ink-faint); }

      /* ---------- 结果页 ---------- */
      .result { padding-top: 8px; }
      .result-card { padding: 30px 20px 24px; text-align: center; overflow: hidden; }
      .result-card.reveal { animation: reveal .55s cubic-bezier(.2, 1.2, .3, 1) both; }
      @keyframes reveal { from { opacity: 0; transform: scale(.9) translateY(16px); } to { opacity: 1; transform: none; } }
      .score-line { font-size: 14px; color: var(--ink-soft); margin: 0 0 14px; }
      .score-line b {
        font-size: 30px; color: var(--gold); font-weight: 900; padding: 0 3px;
        text-shadow: 0 0 18px rgba(242, 193, 78, .55);
      }
      .result-type {
        font-size: 34px; font-weight: 900; margin: 0 0 8px; letter-spacing: 1px;
        background: linear-gradient(100deg, #f5d0fe, #c084fc 55%, #f0abfc);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 3px 14px rgba(192, 132, 252, .4));
      }
      .result-tag { font-size: 17px; color: var(--gold); font-weight: 800; margin: 0 0 22px; }
      .spectrum { margin: 2px 2px 6px; text-align: left; }
      .spectrum .bar { position: relative; height: 11px; border-radius: 999px; background: var(--track); box-shadow: inset 0 2px 5px rgba(0,0,0,.45); }
      .spectrum .bar i {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px;
        background: linear-gradient(90deg, #7c3aed, #d946ef);
        box-shadow: 0 0 12px rgba(217, 70, 239, .75);
        transition: width 1s cubic-bezier(.2, .8, .2, 1) .25s;
      }
      .spectrum .bar .dot {
        position: absolute; top: 50%; width: 21px; height: 21px; border-radius: 50%;
        background: #2a1454; border: 3px solid var(--gold);
        transform: translate(-50%, -50%); left: 0;
        box-shadow: 0 0 14px rgba(242, 193, 78, .8);
        transition: left 1s cubic-bezier(.2, .8, .2, 1) .25s;
      }
      .spectrum .ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-faint); margin-top: 9px; }
      .spectrum .ends b { color: var(--ink-soft); }
      .result-body { text-align: left; margin-top: 20px; }
      .result-body h2 {
        font-size: 12.5px; letter-spacing: 3px; color: var(--gold); margin: 20px 0 7px; font-weight: 800;
        display: flex; align-items: center; gap: 10px;
      }
      .result-body h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(242,193,78,.5), transparent); }
      .result-body h2:first-child { margin-top: 0; }
      .result-body p { font-size: 16px; line-height: 1.78; margin: 0; }
      .result-actions { display: grid; gap: 11px; margin-top: 22px; }
      .copied { text-align: center; font-size: 13.5px; color: var(--gold); min-height: 20px; margin-top: 10px; font-weight: 700; }
      .foot-note { text-align: center; font-size: 12.5px; color: var(--ink-faint); margin-top: 20px; line-height: 1.7; }

      /* ---------- 音乐开关 ---------- */
      .music-btn {
        position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 14px; z-index: 20;
        width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
        border: 1px solid var(--line); background: rgba(38, 24, 64, .85); color: var(--ink-soft);
        backdrop-filter: blur(6px); box-shadow: 0 8px 20px rgba(5, 0, 18, .45);
        display: flex; align-items: center; justify-content: center;
        transition: color .2s ease, border-color .2s ease, box-shadow .2s ease;
      }
      .music-btn svg { width: 21px; height: 21px; fill: currentColor; }
      .music-btn::after {
        content: ""; position: absolute; width: 27px; height: 2.5px; border-radius: 2px;
        background: var(--accent-2); transform: rotate(-38deg);
        box-shadow: 0 1px 5px rgba(0, 0, 0, .5);
      }
      .music-btn.playing { color: var(--gold); border-color: rgba(242, 193, 78, .6); box-shadow: 0 0 18px rgba(242, 193, 78, .35), 0 8px 20px rgba(5, 0, 18, .45); }
      .music-btn.playing::after { display: none; }
      .music-btn.playing svg { display: none; }
      .music-btn .eq { display: none; align-items: flex-end; gap: 3px; height: 16px; }
      .music-btn.playing .eq { display: flex; }
      .music-btn .eq i { width: 3.5px; height: 100%; border-radius: 2px; background: var(--gold); transform-origin: bottom; animation: eqb .72s ease-in-out infinite; }
      .music-btn .eq i:nth-child(2) { animation-delay: .18s; animation-duration: .58s; }
      .music-btn .eq i:nth-child(3) { animation-delay: .36s; animation-duration: .82s; }
      @keyframes eqb { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

      /* 五彩纸屑 */
      .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
      .confetti i {
        position: absolute; top: -14px; width: 9px; height: 14px; border-radius: 2px;
        animation: fall linear both;
      }
      @keyframes fall {
        to { transform: translateY(105dvh) rotate(660deg); opacity: .9; }
      }

      @media (min-width: 640px) {
        .wrap { padding-top: 42px; }
        h1 { font-size: 42px; }
        .qtext { font-size: 21px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb, .duo .s, .duo .m, .btn-primary::after, .track i::after, .music-btn .eq i { animation: none; }
        .qcard.enter, .opt, .result-card.reveal { animation: none; }
        .spectrum .bar i, .spectrum .bar .dot { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <button class="music-btn playing" id="music-btn" type="button" aria-label="关闭音乐" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20.2a3.1 3.1 0 1 1-2-2.87V6.1c0-.42.28-.79.68-.93l9.5-2.85A1 1 0 0 1 19.5 3.3v12.03a3.1 3.1 0 1 1-2-2.86V5.62L10 7.86v12.34z"/></svg>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <main class="wrap">

      <!-- 封面 -->
      <section class="screen cover active" id="screen-cover">
        <div class="panel cover-inner">
          <div class="duo" aria-hidden="true">
            <div class="letter s"><b>S</b><span>掌控全场</span></div>
            <div class="vs">VS</div>
            <div class="letter m"><b>M</b><span>享受被支配</span></div>
          </div>
          <h1>测你是 <span class="hl">S</span> 还是 <span class="hl">M</span></h1>
          <p class="subtitle">你是掌控全场的 S，还是享受被支配的 M？25 道题，测出你在感情里的真实属性。</p>
          <div class="meta-row">
            <span>共 25 题</span><span>约 2 分钟</span><span>凭第一直觉选</span>
          </div>
          <button class="btn btn-primary" id="btn-start" type="button">开始测试</button>
          <p class="cover-note">娱乐向趣味测试，结果只在本机计算，不收集、不上传任何答案。<br />背景音乐默认开启，右上角按钮可随时开关。</p>
        </div>
      </section>

      <!-- 题目 -->
      <section class="screen" id="screen-quiz" aria-live="polite">
        <div class="quiz-top">
          <div class="progress-meta">
            <span class="count">第 <em id="q-now">1</em> / 25 题</span>
            <span class="pct" id="q-pct">4%</span>
          </div>
          <div class="track"><i id="q-bar"></i></div>
        </div>
        <div class="panel qcard" id="q-card">
          <span class="qnum" id="q-num">QUESTION 01</span>
          <p class="qtext" id="q-text"></p>
          <div class="options" id="q-options"></div>
        </div>
        <div class="quiz-foot">
          <button class="back-btn" id="btn-back" type="button">← 上一题</button>
          <span class="hint">点选项自动进入下一题</span>
        </div>
      </section>

      <!-- 结果 -->
      <section class="screen result" id="screen-result">
        <div class="panel result-card" id="result-card">
          <p class="score-line">你的总分 <b id="r-score">0</b> / 100 分</p>
          <p class="result-type" id="r-type"></p>
          <p class="result-tag" id="r-tag"></p>
          <div class="spectrum">
            <div class="bar"><i id="r-fill"></i><span class="dot" id="r-dot"></span></div>
            <div class="ends"><span><b>M</b> · 享受被支配</span><span>享受掌控 · <b>S</b></span></div>
          </div>
          <div class="result-body">
            <h2>结果解读</h2>
            <p id="r-desc"></p>
            <h2>给你的一句建议</h2>
            <p id="r-tip"></p>
          </div>
        </div>
        <div class="result-actions">
          <button class="btn btn-primary" id="btn-copy" type="button">一键复制我的结果</button>
          <button class="btn btn-ghost" id="btn-restart" type="button">重新测一次</button>
        </div>
        <p class="copied" id="copy-tip" role="status"></p>
        <p class="foot-note">本测试为娱乐向趣味测试，不构成任何心理或医学诊断。<br />把结果发给对象对答案，往往比结果本身更有意思。</p>
      </section>

    </main>

<script>
// 分值：4 = S 倾向最强，1 = M 倾向最强
var QUESTIONS = [
{ q: "在感情里，你更享受哪种角色？", o: [["掌控对方、说了算", 4], ["被对方掌控、听他安排", 1], ["看心情，两种都试试", 2], ["两个人平等，谁也不压谁", 3]]},
{ q: "对方突然命令你“过来，跪下”，你第一反应是？", o: [["照做，心里还挺兴奋", 1], ["嘴上说不要，身体很诚实", 2], ["反过来命令他“你跪下”", 4], ["凭什么命令我", 3]]},
{ q: "你幻想过被对方完全支配、捆住手脚一次吗？", o: [["经常想", 1], ["偶尔想想", 2], ["没想过，但可以试试", 3], ["我只想支配别人", 4]]},
{ q: "约会谁说了算？", o: [["我说了算，行程我定", 4], ["对方说了算，我跟着就行", 1], ["一人定一次，轮流来", 2], ["谁的主意好听谁的", 3]]},

{ max: 40, type: "乖巧M型", tag: "你定，我都行", desc: "你随和好说话，最怕的是选错；有人替你定、管着你，你就安心，命令对你来说是种安全感。", tip: "小事上试着自己定一次，你会发现也没那么难。"},

var KEYS = ["A", "B", "C", "D"];
var answers = [];
var current = 0;
var locked = false;
var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var screens = {
cover: document.getElementById("screen-cover"),
quiz: document.getElementById("screen-quiz"),
result: document.getElementById("screen-result")
};
var elNow = document.getElementById("q-now");
var elPct = document.getElementById("q-pct");
var elBar = document.getElementById("q-bar");
var elNum = document.getElementById("q-num");
var elText = document.getElementById("q-text");
var elOpts = document.getElementById("q-options");
var elCard = document.getElementById("q-card");
var btnBack = document.getElementById("btn-back");

function show(name) {
for (var k in screens) screens[k].classList.toggle("active", k === name);
window.scrollTo(0, 0);
}

function renderQuestion() {
locked = false;
var item = QUESTIONS[current];
elNow.textContent = current + 1;
var pct = Math.round(((current + 1) / QUESTIONS.length) * 100);
elPct.textContent = pct + "%";
elBar.style.width = pct + "%";
elNum.textContent = "QUESTION " + (current + 1 < 10? "0": "") + (current + 1);
elText.textContent = item.q;
elOpts.innerHTML = "";
item.o.forEach(function (opt, i) {
var b = document.createElement("button");
b.type = "button";
b.className = "opt";
var key = document.createElement("span");
key.className = "key";
key.textContent = KEYS[i];
var label = document.createElement("span");
label.textContent = opt[0];
b.appendChild(key);
b.appendChild(label);
if (answers[current] === opt[1]) b.classList.add("picked");
b.addEventListener("click", function () { pick(b, opt[1]);});
elOpts.appendChild(b);
});
btnBack.disabled = current === 0;
elCard.classList.remove("enter");
void elCard.offsetWidth;
elCard.classList.add("enter");
}

function pick(btn, score) {
if (locked) return;
locked = true;
answers[current] = score;
var opts = elOpts.querySelectorAll(".opt");
for (var i = 0; i < opts.length; i++) opts[i].classList.remove("picked");
btn.classList.add("picked");
blip();
if (navigator.vibrate) { try { navigator.vibrate(12);} catch (e) {}}
setTimeout(function () {
if (current < QUESTIONS.length - 1) {
current++;
renderQuestion();
} else {
showResult();
}
}, 340);
}

function resultFor(score) {
for (var i = 0; i < RESULTS.length; i++) {
if (score <= RESULTS[i].max) return RESULTS[i];
}
return RESULTS[RESULTS.length - 1];
}

var lastResultText = "";

function confettiBurst() {
if (reduced) return;
var box = document.getElementById("confetti");
var colors = ["#a855f7", "#e056b8", "#f2c14e", "#f5d0fe", "#7dd3fc"];
for (var i = 0; i < 42; i++) {
var p = document.createElement("i");
p.style.left = (Math.random() * 100) + "%";
p.style.background = colors[i % colors.length];
p.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
p.style.animationDelay = (Math.random() * 0.35) + "s";
p.style.transform = "rotate(" + Math.floor(Math.random() * 360) + "deg)";
if (i % 3 === 0) p.style.borderRadius = "50%";
box.appendChild(p);
}
setTimeout(function () { box.innerHTML = "";}, 4200);
}

function countUp(el, target) {
if (reduced) { el.textContent = target; return;}
var start = null;
function step(ts) {
if (!start) start = ts;
var t = Math.min((ts - start) / 900, 1);
el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
if (t < 1) requestAnimationFrame(step);
}
requestAnimationFrame(step);
}

function showResult() {
var score = 0;
for (var i = 0; i < answers.length; i++) score += answers[i] || 0;
var r = resultFor(score);
var scoreEl = document.getElementById("r-score");
document.getElementById("r-type").textContent = r.type;
document.getElementById("r-tag").textContent = "“" + r.tag + "”";
document.getElementById("r-desc").textContent = r.desc;
document.getElementById("r-tip").textContent = r.tip;
document.getElementById("copy-tip").textContent = "";
var fill = document.getElementById("r-fill");
var dot = document.getElementById("r-dot");
fill.style.width = "0%";
dot.style.left = "0%";
lastResultText = "我的结果：" + r.type + "（" + score + " 分）——" + r.tag + "。" + r.desc + " 建议：" + r.tip;
show("result");
var card = document.getElementById("result-card");
card.classList.remove("reveal");
void card.offsetWidth;
card.classList.add("reveal");
countUp(scoreEl, score);
var pos = ((score - 25) / 75) * 100;
requestAnimationFrame(function () {
requestAnimationFrame(function () {
fill.style.width = pos + "%";
dot.style.left = pos + "%";
});
});
confettiBurst();
fanfare();
}

// ---------- 背景音乐：Web Audio 现场合成，无外部音频文件，国内网络直接播放 ----------
var audioCtx = null, masterGain = null, musicTimer = null, noiseBuf = null;
var soundOn = true, musicStarted = false;
var musicBtn = document.getElementById("music-btn");

function ensureAudio() {
if (audioCtx) return true;
var AC = window.AudioContext || window.webkitAudioContext;
if (!AC) return false;
try { audioCtx = new AC(); } catch (e) { return false; }
masterGain = audioCtx.createGain();
masterGain.gain.value = 0;
masterGain.connect(audioCtx.destination);
return true;
}
function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function playTone(midi, t, dur, type, vol, when) {
var o = audioCtx.createOscillator(), g = audioCtx.createGain();
o.type = type;
o.frequency.value = midiHz(midi);
g.gain.setValueAtTime(0.0001, t);
g.gain.linearRampToValueAtTime(vol, t + 0.02);
g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
o.connect(g);
g.connect(when || masterGain);
o.start(t);
o.stop(t + dur + 0.05);
}
function playHat(t) {
if (!noiseBuf) {
noiseBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.05), audioCtx.sampleRate);
var d = noiseBuf.getChannelData(0);
for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
var src = audioCtx.createBufferSource();
src.buffer = noiseBuf;
var f = audioCtx.createBiquadFilter();
f.type = "highpass";
f.frequency.value = 7200;
var g = audioCtx.createGain();
g.gain.setValueAtTime(0.045, t);
g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
src.connect(f);
f.connect(g);
g.connect(masterGain);
src.start(t);
src.stop(t + 0.06);
}

// A 小调进行：Am – F – C – G，102 BPM 八分音符步进
var STEP_LEN = 60 / 102 / 2;
var CHORDS = [[45, 57, 60, 64], [41, 53, 57, 60], [48, 55, 60, 64], [43, 55, 59, 62]];
var ARP_IDX = [1, 2, 3, 2, 1, 3, 2, 3];
var stepIdx = 0, nextTime = 0;

function scheduleStep(s, t) {
var chord = CHORDS[Math.floor(s / 8) % CHORDS.length];
var pos = s % 8;
if (pos === 0 || pos === 4) playTone(chord[0], t, 0.55, "sine", 0.5);
if (pos === 6) playTone(chord[0] + 7, t, 0.3, "sine", 0.2);
var tone = chord[ARP_IDX[pos]] + (pos === 3 || pos === 6 ? 12 : 0);
playTone(tone, t, 0.34, "triangle", 0.3);
if (pos % 2 === 0) playHat(t);
}
function scheduler() {
while (nextTime < audioCtx.currentTime + 0.25) {
scheduleStep(stepIdx, nextTime);
nextTime += STEP_LEN;
stepIdx++;
}
}
function setSound(on) {
soundOn = on;
if (audioCtx && masterGain) {
var t = audioCtx.currentTime;
masterGain.gain.cancelScheduledValues(t);
masterGain.gain.setValueAtTime(masterGain.gain.value, t);
masterGain.gain.linearRampToValueAtTime(on ? 0.13 : 0, t + 0.4);
}
musicBtn.classList.toggle("playing", on);
musicBtn.setAttribute("aria-pressed", on ? "true" : "false");
musicBtn.setAttribute("aria-label", on ? "关闭音乐" : "打开音乐");
}
function startMusic() {
if (!ensureAudio()) return;
if (audioCtx.state === "suspended") { try { audioCtx.resume(); } catch (e) {} }
if (!musicStarted) {
musicStarted = true;
stepIdx = 0;
nextTime = audioCtx.currentTime + 0.08;
musicTimer = setInterval(scheduler, 90);
}
setSound(soundOn);
}
musicBtn.addEventListener("click", function () {
if (!musicStarted) startMusic();
else setSound(!soundOn);
});
// 音乐默认开启：加载即启动合成；浏览器在首次交互前会挂起音频，首次点触任意处自动续播
startMusic();
function wakeAudio() {
if (!audioCtx) return;
if (audioCtx.state === "suspended") { try { audioCtx.resume(); } catch (e) {} }
if (soundOn) setSound(true);
}
document.addEventListener("pointerdown", wakeAudio, true);
document.addEventListener("touchstart", wakeAudio, true);
function blip() {
if (!soundOn || !audioCtx) return;
var t = audioCtx.currentTime;
playTone(76, t, 0.14, "sine", 0.22);
playTone(83, t + 0.06, 0.18, "sine", 0.18);
}
function fanfare() {
if (!soundOn || !audioCtx) return;
var t = audioCtx.currentTime;
var notes = [69, 72, 76, 81];
for (var i = 0; i < notes.length; i++) playTone(notes[i], t + i * 0.11, 0.42, "triangle", 0.3);
}

document.getElementById("btn-start").addEventListener("click", function () {
startMusic();
answers = [];
current = 0;
show("quiz");
renderQuestion();
});

btnBack.addEventListener("click", function () {
if (current > 0 &&!locked) {
current--;
renderQuestion();
}
});

document.getElementById("btn-restart").addEventListener("click", function () {
answers = [];
current = 0;
show("cover");
});

document.getElementById("btn-copy").addEventListener("click", function () {
var tip = document.getElementById("copy-tip");
function done() { tip.textContent = "已复制，去粘贴分享给朋友吧。";}
function fallback() {
var ta = document.createElement("textarea");
ta.value = lastResultText;
ta.style.position = "fixed";
ta.style.opacity = "0";
document.body.appendChild(ta);
ta.select();
try { document.execCommand("copy"); done();}
catch (e) { tip.textContent = "复制失败，长按结果文字手动复制吧。";}
document.body.removeChild(ta);
}
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(lastResultText).then(done, fallback);
} else {
fallback();
}
});

document.addEventListener("keydown", function (e) {
if (!screens.quiz.classList.contains("active")) return;
var n = parseInt(e.key, 10);
if (n >= 1 && n <= 4) {
var btn = elOpts.querySelectorAll(".opt")[n - 1];
if (btn) btn.click();
}
});
</script>
